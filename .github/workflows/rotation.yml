name: Genis Evren + Rotasyon (30 vs 60)

# Evren 30->60 coin + sermaye rotasyonu (slot bosalinca en iyi sinyale kayar).
# Edge yeni coinlerde tutuyor mu + breadth CAGR/Sharpe/DD'ye etkisi. Elle tetiklenir.
on:
  workflow_dispatch: {}

jobs:
  rotation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Genis evren + rotasyon testi (60 coin)
        run: python -u lab/rotation.py
