name: Mimari Dogrulama (manuel)

# Paylasimli-sermaye backtest: canli botun uygulayacagi GERCEK mantik (SMP+Trend,
# eszamanlilik + bilesik sizing) -> tek equity egrisi, olcek 1x/1.5x/2x. Elle tetiklenir.
on:
  workflow_dispatch: {}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas numpy requests
      - name: Mimari dogrulama (30 coin)
        run: python -u live/validate.py
